; Shared PHP configuration for both the dev and production targets.

memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 20M
post_max_size = 20M

date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

realpath_cache_size = 4096k
realpath_cache_ttl = 600
