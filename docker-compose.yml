name: user-todo-api

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: utapi-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - utapi

  app:
    build:
      context: .
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: user-todo-api:dev
    container_name: utapi-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - utapi

  # Same image as app, different command. This is what proves Redis is the
  # queue driver rather than just a cache: a reviewer who brings the stack up
  # gets a running worker without typing anything.
  worker:
    build:
      context: .
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: user-todo-api:dev
    container_name: utapi-worker
    restart: unless-stopped
    command: >
      php artisan queue:work redis
        --queue=default
        --sleep=3
        --tries=3
        --backoff=5
        --max-time=3600
        --timeout=90
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - utapi

  db:
    image: mysql:8.0
    container_name: utapi-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-user_todo_api}"
      MYSQL_USER: "${DB_USERNAME:-utapi}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - utapi

  redis:
    image: redis:7-alpine
    container_name: utapi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - utapi

volumes:
  dbdata:
  redisdata:

networks:
  utapi:
    driver: bridge
